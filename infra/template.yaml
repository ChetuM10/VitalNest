AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VitalNest T0 skeleton - Cognito, streaming REST API, FastAPI Lambda (spike)

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Frontend origin allowed by CORS (the Vercel URL once known).
  CallbackUrl:
    Type: String
    Default: http://localhost:5173/callback
    Description: Cognito Hosted UI redirect after login.
  LogoutUrl:
    Type: String
    Default: http://localhost:5173/
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique prefix for the Hosted UI domain (lowercase letters, digits, hyphens; must not contain the words aws, amazon or cognito).
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    ConstraintDescription: Use lowercase letters, digits and hyphens only.
  WebAdapterLayerVersion:
    Type: String
    Default: '30'
    Description: Lambda Web Adapter layer version (30 is the version in the adapter's official README and FastAPI streaming example).

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: vitalnest-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OFF'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: vitalnest-web
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Ref CallbackUrl]
      LogoutURLs: [!Ref LogoutUrl]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: run.sh
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 30
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:${WebAdapterLayerVersion}
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          AWS_LWA_READINESS_CHECK_PATH: /v1/health
          PORT: '8000'
          ALLOWED_ORIGIN: !Ref AllowedOrigin

  # Required because the API is defined by an inline OpenAPI body (no SAM Events).
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      # Without this, SAM also creates a second, unused stage named "Stage".
      OpenApiVersion: '3.0.1'
      # Streamed responses time out after 30 s of silence on edge-optimized APIs (the default)
      # but after 5 min on regional ones, so use REGIONAL.
      EndpointConfiguration:
        Type: REGIONAL
      # Throttling is a prototype cost guard (starting values; tuned on Day 2).
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
      # Authorizer failures happen before FastAPI runs, so CORS headers must be added here.
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Authorization,Content-Type'"
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: vitalnest-api
          version: '0.0.1'
        paths:
          # Public: liveness check (also the Web Adapter readiness path).
          /v1/health:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${ApiFunction.Arn}/response-streaming-invocations
                responseTransferMode: STREAM
                timeoutInMillis: 29000
            options:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${ApiFunction.Arn}/response-streaming-invocations
                responseTransferMode: STREAM
                timeoutInMillis: 29000
          # Everything else under /v1 requires a valid Cognito token at the gateway.
          # OPTIONS stays open so browser CORS preflight (which carries no token) works.
          /v1/{proxy+}:
            x-amazon-apigateway-any-method:
              parameters:
                - name: proxy
                  in: path
                  required: true
                  schema:
                    type: string
              security:
                - CognitoAuth: []
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${ApiFunction.Arn}/response-streaming-invocations
                responseTransferMode: STREAM
                timeoutInMillis: 29000
            options:
              parameters:
                - name: proxy
                  in: path
                  required: true
                  schema:
                    type: string
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${ApiFunction.Arn}/response-streaming-invocations
                responseTransferMode: STREAM
                timeoutInMillis: 29000
        components:
          securitySchemes:
            CognitoAuth:
              type: apiKey
              name: Authorization
              in: header
              x-amazon-apigateway-authtype: cognito_user_pools
              x-amazon-apigateway-authorizer:
                type: cognito_user_pools
                providerARNs:
                  - !GetAtt UserPool.Arn

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  HostedUiBaseUrl:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
